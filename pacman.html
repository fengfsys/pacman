<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pac-Man</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";

// ---------- Maze ----------
// # wall, . dot, o power pellet, - ghost-house door, space = empty
const MAP = [
  "############################",
  "#............##............#",
  "#.####.#####.##.#####.####.#",
  "#o####.#####.##.#####.####o#",
  "#.####.#####.##.#####.####.#",
  "#..........................#",
  "#.####.##.########.##.####.#",
  "#.####.##.########.##.####.#",
  "#......##....##....##......#",
  "######.##### ## #####.######",
  "     #.##### ## #####.#     ",
  "     #.##          ##.#     ",
  "     #.## ###--### ##.#     ",
  "######.## #      # ##.######",
  "      .   #      #   .      ",
  "######.## #      # ##.######",
  "     #.## ######## ##.#     ",
  "     #.##          ##.#     ",
  "     #.## ######## ##.#     ",
  "######.## ######## ##.######",
  "#............##............#",
  "#.####.#####.##.#####.####.#",
  "#.####.#####.##.#####.####.#",
  "#o..##.......  .......##..o#",
  "###.##.##.########.##.##.###",
  "###.##.##.########.##.##.###",
  "#......##....##....##......#",
  "#.##########.##.##########.#",
  "#.##########.##.##########.#",
  "#..........................#",
  "############################",
];
const COLS = 28, ROWS = 31, TS = 16, TOP = 3;
const W = COLS * TS, H = (ROWS + TOP + 2) * TS;
const BASE = 9.5; // tiles per second at 100% speed

const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * s + "px";
  cv.style.height = H * s + "px";
  cv.width = Math.round(W * s * dpr);
  cv.height = Math.round(H * s * dpr);
  ctx.setTransform(s * dpr, 0, 0, s * dpr, 0, 0);
}
addEventListener("resize", resize);
resize();

function cell(x, y) {
  if (y < 0 || y >= ROWS) return "#";
  x = ((x % COLS) + COLS) % COLS;
  return MAP[y][x];
}
function open(x, y) { const c = cell(x, y); return c !== "#" && c !== "-"; }

// Wall outline segments, computed once.
const segs = (() => {
  const wall = (x, y) => {
    if (y < 0 || y >= ROWS) return true;
    return MAP[y][Math.max(0, Math.min(COLS - 1, x))] === "#";
  };
  const edge = (x, y) => {
    if (!wall(x, y)) return false;
    for (let dy = -1; dy <= 1; dy++)
      for (let dx = -1; dx <= 1; dx++) if (!wall(x + dx, y + dy)) return true;
    return false;
  };
  const out = [];
  for (let y = 0; y < ROWS; y++)
    for (let x = 0; x < COLS; x++) {
      if (!edge(x, y)) continue;
      if (x + 1 < COLS && edge(x + 1, y) &&
          (!wall(x, y - 1) || !wall(x + 1, y - 1) || !wall(x, y + 1) || !wall(x + 1, y + 1)))
        out.push([x, y, x + 1, y]);
      if (y + 1 < ROWS && edge(x, y + 1) &&
          (!wall(x - 1, y) || !wall(x - 1, y + 1) || !wall(x + 1, y) || !wall(x + 1, y + 1)))
        out.push([x, y, x, y + 1]);
    }
  return out;
})();

// ---------- Directions ----------
const D = {
  up: { x: 0, y: -1 }, left: { x: -1, y: 0 }, down: { x: 0, y: 1 },
  right: { x: 1, y: 0 }, none: { x: 0, y: 0 },
};
const ORDER = [D.up, D.left, D.down, D.right];
const isOpp = (a, b) => (a.x || a.y) && a.x === -b.x && a.y === -b.y;
const opp = (d) => ORDER.find((o) => o.x === -d.x && o.y === -d.y) || D.none;

// ---------- Sound ----------
let actx = null, muted = false;
function initAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === "suspended") actx.resume();
}
function tone(f1, f2, dur, type = "square", vol = 0.04, delay = 0) {
  if (muted || !actx) return;
  const t = actx.currentTime + delay;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f1, t);
  o.frequency.linearRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(actx.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
let wakaFlip = false;
const sfx = {
  waka() { wakaFlip = !wakaFlip; wakaFlip ? tone(260, 520, 0.08, "triangle", 0.08) : tone(520, 260, 0.08, "triangle", 0.08); },
  power() { tone(150, 900, 0.3, "square", 0.04); },
  ghost() { tone(200, 1400, 0.35, "square", 0.04); },
  fruit() { tone(500, 1000, 0.15, "square", 0.04); tone(1000, 1300, 0.15, "square", 0.04, 0.15); },
  death() { tone(900, 80, 1.4, "sawtooth", 0.05); },
  life() { [0, 0.15, 0.3].forEach((d) => tone(1000, 1000, 0.12, "square", 0.04, d)); },
  intro() {
    const notes = [494, 988, 740, 622, 988, 740, 622, 523, 1046, 784, 659, 1046, 784, 659,
                   494, 988, 740, 622, 988, 740, 622, 622, 659, 698, 698, 740, 784, 784, 831, 880, 988];
    const lens = [1,1,1,1,.5,1,2, 1,1,1,1,.5,1,2, 1,1,1,1,.5,1,2, .5,.5,1, .5,.5,1, .5,.5,1, 2];
    let t = 0;
    notes.forEach((n, i) => { tone(n, n, 0.12 * lens[i], "square", 0.035, t); t += 0.13 * lens[i]; });
  },
};

// ---------- Game state ----------
let state = "title", paused = false, timer = 0, anim = 0;
let score = 0, hi = +(localStorage.getItem("pacman.hi") || 0), lives = 3, level = 1, extraGiven = false;
let dots, dotsLeft = 0, dotsEaten = 0;
let mode = "scatter", modeIdx = 0, modeT = 0, frightT = 0, combo = 0, idleT = 0, freeze = 0;
let fruit = null, fruitSpawns = 0, popups = [], eatPop = null;

const pac = {
  x: 13.5, y: 23, dir: D.left, next: D.left, face: D.left, mouth: 0,
  decide(cx, cy) {
    if (open(cx + this.next.x, cy + this.next.y)) this.dir = this.next;
    else if (!open(cx + this.dir.x, cy + this.dir.y)) this.dir = D.none;
  },
};

function makeGhost(name, color, x, y, scatter) {
  return {
    name, color, sx: x, sy: y, scatter, x, y, dir: D.left, state: "house",
    fright: false, dotCount: 0, limit: 0,
    decide(cx, cy) { ghostDecide(this, cx, cy); },
  };
}
const blinky = makeGhost("blinky", "#ff0000", 13.5, 11, { x: COLS - 3, y: -4 });
const pinky = makeGhost("pinky", "#ffb8ff", 13.5, 14, { x: 2, y: -4 });
const inky = makeGhost("inky", "#00ffff", 11.5, 14, { x: COLS - 1, y: ROWS + 1 });
const clyde = makeGhost("clyde", "#ffb852", 15.5, 14, { x: 0, y: ROWS + 1 });
const ghosts = [blinky, pinky, inky, clyde];

function speeds() {
  if (level === 1) return { pac: 0.8, pacF: 0.9, ghost: 0.75, ghostF: 0.5, tunnel: 0.4 };
  if (level < 5) return { pac: 0.9, pacF: 0.95, ghost: 0.85, ghostF: 0.55, tunnel: 0.45 };
  return { pac: 1, pacF: 1, ghost: 0.95, ghostF: 0.6, tunnel: 0.5 };
}
function schedule() {
  if (level === 1) return [7, 20, 7, 20, 5, 20, 5];
  if (level < 5) return [7, 20, 7, 20, 5, 1033, 1 / 60];
  return [5, 20, 5, 20, 5, 1037, 1 / 60];
}
const FRIGHT = [6, 5, 4, 3, 2, 5, 2, 2, 1, 5, 2, 1, 1, 3, 1, 1, 0, 1];
const frightTime = () => FRIGHT[level - 1] ?? 0;
const FRUITS = [
  { c: "#ff0000", p: 100 }, { c: "#ff3060", p: 300 }, { c: "#ffa020", p: 500 }, { c: "#ffa020", p: 500 },
  { c: "#ff2020", p: 700 }, { c: "#ff2020", p: 700 }, { c: "#40d040", p: 1000 }, { c: "#40d040", p: 1000 },
  { c: "#ffff00", p: 2000 }, { c: "#ffff00", p: 2000 }, { c: "#ffd700", p: 3000 }, { c: "#ffd700", p: 3000 },
  { c: "#80d0ff", p: 5000 },
];
const fruitFor = (l) => FRUITS[Math.min(l, FRUITS.length) - 1];

function resetDots() {
  dots = MAP.map((r) => r.split("").map((c) => (c === "." ? 1 : c === "o" ? 2 : 0)));
  dotsLeft = dots.flat().filter(Boolean).length;
  dotsEaten = 0;
}

function resetActors(afterDeath) {
  Object.assign(pac, { x: 13.5, y: 23, dir: D.left, next: D.left, face: D.left, mouth: 0 });
  for (const g of ghosts) {
    Object.assign(g, { x: g.sx, y: g.sy, fright: false, dotCount: 0, state: g === blinky ? "active" : "house" });
    g.dir = g === blinky ? D.left : g === pinky ? D.down : D.up;
  }
  if (afterDeath) { pinky.limit = 7; inky.limit = 17; clyde.limit = 32; }
  else {
    pinky.limit = 0;
    inky.limit = level === 1 ? 30 : 0;
    clyde.limit = level === 1 ? 60 : level === 2 ? 50 : 0;
  }
  mode = "scatter"; modeIdx = 0; modeT = 0; frightT = 0; idleT = 0; freeze = 0;
  fruit = null; eatPop = null;
}

function newGame() {
  score = 0; lives = 3; level = 1; extraGiven = false; paused = false;
  startLevel();
  timer = 4.3;
  sfx.intro();
}
function startLevel() {
  resetDots();
  fruitSpawns = 0;
  resetActors(false);
  state = "ready"; timer = 2;
}

function addScore(n) {
  score += n;
  if (!extraGiven && score >= 10000) { extraGiven = true; lives++; sfx.life(); }
  if (score > hi) { hi = score; localStorage.setItem("pacman.hi", hi); }
}

// ---------- Movement ----------
// Moves an entity along the grid by `dist` tiles, calling decide() at each tile centre.
function step(e, dist) {
  let rem = dist, guard = 0;
  while (rem > 1e-6 && guard++ < 6) {
    const cx = Math.round(e.x), cy = Math.round(e.y);
    const atCenter = Math.abs(e.x - cx) < 1e-4 && Math.abs(e.y - cy) < 1e-4;
    let tx, ty;
    if (atCenter) {
      e.x = cx; e.y = cy;
      e.decide(cx, cy);
      if (!e.dir.x && !e.dir.y) return;
      tx = cx + e.dir.x; ty = cy + e.dir.y;
    } else {
      tx = e.dir.x > 0 ? Math.ceil(e.x) : e.dir.x < 0 ? Math.floor(e.x) : e.x;
      ty = e.dir.y > 0 ? Math.ceil(e.y) : e.dir.y < 0 ? Math.floor(e.y) : e.y;
      if (!e.dir.x && !e.dir.y) return;
    }
    const d = Math.abs(tx - e.x) + Math.abs(ty - e.y);
    if (d <= rem) { e.x = tx; e.y = ty; rem -= d; }
    else { e.x += e.dir.x * rem; e.y += e.dir.y * rem; rem = 0; }
    if (e.x < -0.5) e.x += COLS;          // tunnel wrap
    else if (e.x > COLS - 0.5) e.x -= COLS;
  }
}

function ghostTarget(g) {
  if (g.state === "eyes") return { x: 13, y: 11 };
  if (mode === "scatter") return g.scatter;
  const px = Math.round(pac.x), py = Math.round(pac.y), f = pac.face;
  switch (g.name) {
    case "blinky": return { x: px, y: py };
    case "pinky": return { x: px + 4 * f.x, y: py + 4 * f.y };
    case "inky": {
      const ax = px + 2 * f.x, ay = py + 2 * f.y;
      return { x: 2 * ax - Math.round(blinky.x), y: 2 * ay - Math.round(blinky.y) };
    }
    default: {
      const dx = g.x - pac.x, dy = g.y - pac.y;
      return dx * dx + dy * dy > 64 ? { x: px, y: py } : g.scatter;
    }
  }
}

function ghostDecide(g, cx, cy) {
  if (g.state === "eyes" && cy === 11 && (cx === 13 || cx === 14)) {
    g.state = "entering"; g.dir = D.none; return;
  }
  let opts = ORDER.filter((d) => !isOpp(d, g.dir) && open(cx + d.x, cy + d.y));
  if (!opts.length) { g.dir = opp(g.dir); return; }
  if (g.fright && g.state === "active") { g.dir = opts[Math.floor(Math.random() * opts.length)]; return; }
  const t = ghostTarget(g);
  let best = opts[0], bestD = Infinity;
  for (const d of opts) {
    const dx = cx + d.x - t.x, dy = cy + d.y - t.y, dist = dx * dx + dy * dy;
    if (dist < bestD) { bestD = dist; best = d; }
  }
  g.dir = best;
}

function moveAxis(g, axis, target, amt) {
  const diff = target - g[axis];
  if (Math.abs(diff) <= amt) { g[axis] = target; return amt - Math.abs(diff); }
  g[axis] += Math.sign(diff) * amt;
  g.dir = axis === "x" ? (diff > 0 ? D.right : D.left) : (diff > 0 ? D.down : D.up);
  return 0;
}

function updateGhost(g, dt) {
  const sp = speeds();
  switch (g.state) {
    case "house": {
      g.y += g.dir.y * 0.4 * BASE * dt;
      if (g.y <= 13.5) { g.y = 13.5; g.dir = D.down; }
      if (g.y >= 14.5) { g.y = 14.5; g.dir = D.up; }
      break;
    }
    case "leaving": {
      let amt = 0.4 * BASE * dt;
      if (g.x !== 13.5) amt = moveAxis(g, "x", 13.5, amt);
      if (g.x === 13.5 && amt > 0) {
        moveAxis(g, "y", 11, amt);
        if (g.y === 11) { g.state = "active"; g.dir = D.left; }
      }
      break;
    }
    case "entering": {
      let amt = 1.6 * BASE * dt;
      if (g.x !== 13.5) amt = moveAxis(g, "x", 13.5, amt);
      if (g.x === 13.5 && amt > 0) {
        moveAxis(g, "y", 14, amt);
        if (g.y === 14) { g.state = "leaving"; g.fright = false; }
      }
      break;
    }
    default: {
      let m = g.state === "eyes" ? 1.6 : g.fright ? sp.ghostF : sp.ghost;
      if (g.state === "active" && Math.round(g.y) === 14 && (g.x < 5.5 || g.x > 21.5)) m = sp.tunnel;
      step(g, m * BASE * dt);
    }
  }
}

// ---------- Update ----------
function updatePlay(dt) {
  // Scatter/chase timer (paused while ghosts are frightened)
  if (frightT > 0) {
    frightT -= dt;
    if (frightT <= 0) ghosts.forEach((g) => (g.fright = false));
  } else {
    const sched = schedule();
    modeT += dt;
    if (modeIdx < sched.length && modeT >= sched[modeIdx]) {
      modeT = 0; modeIdx++;
      mode = modeIdx % 2 === 0 ? "scatter" : "chase";
      ghosts.forEach((g) => { if (g.state === "active") g.dir = opp(g.dir); });
    }
  }

  // Release ghosts from the house
  idleT += dt;
  const waiting = [pinky, inky, clyde].find((g) => g.state === "house");
  if (waiting && (waiting.dotCount >= waiting.limit || idleT > (level < 5 ? 4 : 3))) {
    waiting.state = "leaving"; idleT = 0;
  }

  // Pac-Man
  const sp = speeds();
  if (isOpp(pac.next, pac.dir)) pac.dir = pac.next;
  const bx = pac.x, by = pac.y;
  step(pac, (frightT > 0 ? sp.pacF : sp.pac) * BASE * dt);
  if (pac.dir.x || pac.dir.y) pac.face = pac.dir;
  if (pac.x !== bx || pac.y !== by) pac.mouth += dt * 18;

  const tx = ((Math.round(pac.x) % COLS) + COLS) % COLS, ty = Math.round(pac.y);
  const dv = dots[ty] && dots[ty][tx];
  if (dv) {
    dots[ty][tx] = 0; dotsLeft--; dotsEaten++; idleT = 0;
    if (waiting) waiting.dotCount++;
    if (dv === 1) { addScore(10); sfx.waka(); }
    else {
      addScore(50); sfx.power();
      frightT = frightTime(); combo = 0;
      ghosts.forEach((g) => {
        if (g.state === "eyes" || g.state === "entering") return;
        if (g.state === "active") g.dir = opp(g.dir);
        g.fright = frightT > 0;
      });
    }
    if ((dotsEaten === 70 || dotsEaten === 170) && fruitSpawns < 2) {
      fruitSpawns++;
      fruit = { t: 9.5 };
    }
    if (dotsLeft === 0) { state = "clear"; timer = 0; return; }
  }

  // Fruit
  if (fruit) {
    fruit.t -= dt;
    if (fruit.t <= 0) fruit = null;
    else if (Math.abs(pac.x - 13.5) < 0.6 && Math.abs(pac.y - 17) < 0.6) {
      const f = fruitFor(level);
      addScore(f.p); sfx.fruit();
      popups.push({ x: 13.5, y: 17, text: String(f.p), t: 1.5, color: "#ffb8ff" });
      fruit = null;
    }
  }

  // Ghosts + collisions
  for (const g of ghosts) {
    updateGhost(g, dt);
    if (g.state !== "active") continue;
    let dx = Math.abs(g.x - pac.x); dx = Math.min(dx, COLS - dx);
    if (dx < 0.6 && Math.abs(g.y - pac.y) < 0.6) {
      if (g.fright) {
        g.fright = false; g.state = "eyes";
        const pts = 200 * 2 ** combo++;
        addScore(pts); sfx.ghost();
        eatPop = { x: pac.x, y: pac.y, text: String(pts) };
        freeze = 0.6;
        return;
      }
      state = "dying"; timer = 0;
      return;
    }
  }
}

function update(dt) {
  anim += dt;
  popups.forEach((p) => (p.t -= dt));
  popups = popups.filter((p) => p.t > 0);
  if (paused) return;
  switch (state) {
    case "ready":
      timer -= dt;
      if (timer <= 0) state = "play";
      break;
    case "play":
      if (freeze > 0) { freeze -= dt; if (freeze <= 0) eatPop = null; break; }
      // Sub-step so fast movers never skip past each other.
      for (let left = dt; left > 0 && state === "play" && freeze <= 0; left -= 1 / 120)
        updatePlay(Math.min(left, 1 / 120));
      break;
    case "dying": {
      const prev = timer;
      timer += dt;
      if (prev < 0.7 && timer >= 0.7) sfx.death();
      if (timer > 2.6) {
        lives--;
        if (lives <= 0) state = "over";
        else { resetActors(true); state = "ready"; timer = 2; }
      }
      break;
    }
    case "clear":
      timer += dt;
      if (timer > 2.4) { level++; startLevel(); }
      break;
  }
}

// ---------- Drawing ----------
const px = (x) => (x + 0.5) * TS;
const py = (y) => (y + 0.5 + TOP) * TS;

function text(s, x, y, color, align = "center", size = 14) {
  ctx.fillStyle = color;
  ctx.font = `bold ${size}px "Consolas", "Courier New", monospace`;
  ctx.textAlign = align;
  ctx.textBaseline = "middle";
  ctx.fillText(s, x, y);
}

function drawMaze() {
  let color = "#2121ff";
  if (state === "clear" && timer > 0.6 && Math.floor(timer * 4) % 2 === 0) color = "#ffffff";
  ctx.save();
  ctx.translate(0, TOP * TS);
  ctx.strokeStyle = color;
  ctx.lineWidth = 2.5;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.beginPath();
  for (const [x1, y1, x2, y2] of segs) {
    ctx.moveTo((x1 + 0.5) * TS, (y1 + 0.5) * TS);
    ctx.lineTo((x2 + 0.5) * TS, (y2 + 0.5) * TS);
  }
  ctx.stroke();
  ctx.fillStyle = "#ffb8de";
  ctx.fillRect(12.5 * TS, 12.5 * TS - 2, 3 * TS, 4); // ghost-house door
  ctx.restore();
}

function drawDots() {
  for (let y = 0; y < ROWS; y++)
    for (let x = 0; x < COLS; x++) {
      const v = dots[y][x];
      if (v === 1) { ctx.fillStyle = "#ffb8ae"; ctx.fillRect(px(x) - 2, py(y) - 2, 4, 4); }
      else if (v === 2 && (state !== "play" || Math.floor(anim * 4) % 2 === 0)) {
        ctx.fillStyle = "#ffb8ae";
        ctx.beginPath(); ctx.arc(px(x), py(y), 6, 0, Math.PI * 2); ctx.fill();
      }
    }
}

function drawPacAt(cx, cy, face, openA, r = 12) {
  const a = Math.atan2(face.y, face.x);
  ctx.fillStyle = "#ffff00";
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.arc(cx, cy, r, a + openA, a + Math.PI * 2 - openA);
  ctx.closePath();
  ctx.fill();
}

function drawGhostAt(cx, cy, color, dir, opts = {}) {
  const r = 12;
  if (!opts.eyesOnly) {
    let body = color, flash = false;
    if (opts.fright) {
      body = "#2121ff";
      if (frightT < 2 && Math.floor(anim * 5) % 2 === 0) { body = "#ffffff"; flash = true; }
    }
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.arc(cx, cy - 1, r, Math.PI, 0);
    const bottom = cy + r;
    ctx.lineTo(cx + r, bottom);
    const phase = Math.floor(anim * 8) % 2, n = 6;
    for (let i = 1; i <= n; i++) ctx.lineTo(cx + r - i * ((2 * r) / n), bottom - ((i + phase) % 2 ? 4 : 0));
    ctx.closePath();
    ctx.fill();
    if (opts.fright) {
      const face = flash ? "#ff0000" : "#ffb8ae";
      ctx.fillStyle = face;
      ctx.fillRect(cx - 6, cy - 5, 4, 4);
      ctx.fillRect(cx + 2, cy - 5, 4, 4);
      ctx.strokeStyle = face; ctx.lineWidth = 1.5;
      ctx.beginPath();
      for (let i = 0; i <= 6; i++) ctx.lineTo(cx - 8 + i * (16 / 6), cy + 5 + (i % 2 ? -2 : 1));
      ctx.stroke();
      return;
    }
  }
  for (const s of [-1, 1]) {
    const ex = cx + s * 5 + dir.x * 2, ey = cy - 3 + dir.y * 2;
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.ellipse(ex, ey, 3.5, 4.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#2121ff";
    ctx.beginPath(); ctx.arc(ex + dir.x * 1.8, ey + dir.y * 2, 2, 0, Math.PI * 2); ctx.fill();
  }
}

function drawGhost(g) {
  drawGhostAt(px(g.x), py(g.y), g.color, g.dir, {
    fright: g.fright,
    eyesOnly: g.state === "eyes" || g.state === "entering",
  });
}

function drawFruitAt(cx, cy, l) {
  const f = fruitFor(l);
  ctx.strokeStyle = "#20a020"; ctx.lineWidth = 2;
  if (l === 1) {
    ctx.beginPath(); ctx.moveTo(cx - 4, cy + 2); ctx.quadraticCurveTo(cx, cy - 8, cx + 5, cy - 8);
    ctx.moveTo(cx + 4, cy + 3); ctx.quadraticCurveTo(cx + 3, cy - 4, cx + 5, cy - 8); ctx.stroke();
    ctx.fillStyle = f.c;
    ctx.beginPath(); ctx.arc(cx - 4, cy + 3, 4.5, 0, Math.PI * 2); ctx.arc(cx + 4, cy + 4, 4.5, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.fillStyle = f.c;
    ctx.beginPath(); ctx.arc(cx, cy + 1, 7, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx, cy - 5); ctx.lineTo(cx + 3, cy - 9); ctx.stroke();
  }
}

function drawHUD() {
  text("1UP", 3 * TS, 0.5 * TS, Math.floor(anim * 3) % 2 || state !== "play" ? "#fff" : "#000", "left");
  text(String(score).padStart(2, "0"), 7 * TS, 1.6 * TS, "#fff", "right");
  text("HIGH SCORE", W / 2, 0.5 * TS, "#fff");
  text(String(hi).padStart(2, "0"), W / 2, 1.6 * TS, "#fff");
  text("LEVEL " + level, W - 2 * TS, 0.5 * TS, "#fff", "right");
  const by = (ROWS + TOP + 1) * TS;
  for (let i = 0; i < Math.min(lives - 1, 6); i++) drawPacAt(2.5 * TS + i * 2 * TS, by, D.left, 0.6, 10);
  for (let i = 0; i < Math.min(level, 7); i++) drawFruitAt(W - 2.5 * TS - i * 2 * TS, by, level - i);
}

function drawTitle() {
  text("PAC-MAN", W / 2, 5 * TS, "#ffff00", "center", 48);
  const names = [["BLINKY", "#ff0000"], ["PINKY", "#ffb8ff"], ["INKY", "#00ffff"], ["CLYDE", "#ffb852"]];
  names.forEach(([n, c], i) => {
    const y = (10 + i * 2.5) * TS;
    drawGhostAt(9 * TS, y, c, D.right);
    text(n, 12 * TS, y, c, "left", 16);
  });
  const t = (anim * 6) % (COLS + 8) - 4;
  drawPacAt((t + 0.5) * TS, 21.5 * TS, D.right, 0.05 + 0.75 * Math.abs(Math.sin(anim * 12)));
  drawGhostAt((t - 3 + 0.5) * TS, 21.5 * TS, "#ff0000", D.right, { fright: true });
  if (Math.floor(anim * 2) % 2 === 0) text("PRESS ENTER TO START", W / 2, 25 * TS, "#fff", "center", 16);
  text("ARROWS / WASD  move", W / 2, 28.5 * TS, "#ffb8ae");
  text("P  pause    M  mute    F  fullscreen", W / 2, 30 * TS, "#ffb8ae");
  text("HIGH SCORE  " + hi, W / 2, 33 * TS, "#fff");
}

function draw() {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);
  if (state === "title") { drawTitle(); return; }

  drawMaze();
  drawDots();
  if (fruit) drawFruitAt(px(13.5), py(17), level);

  const hideGhosts = (state === "dying" && timer > 0.7) || state === "clear";
  if (!hideGhosts) ghosts.forEach(drawGhost);

  if (state === "dying") {
    const p = Math.max(0, Math.min(1, (timer - 0.7) / 1.5));
    if (p < 1) drawPacAt(px(pac.x), py(pac.y), D.up, 0.05 + p * Math.PI);
  } else if (eatPop) {
    text(eatPop.text, px(eatPop.x), py(eatPop.y), "#00ffff", "center", 12);
  } else if (state !== "over") {
    drawPacAt(px(pac.x), py(pac.y), pac.face, 0.05 + 0.75 * Math.abs(Math.sin(pac.mouth)));
  }

  for (const p of popups) text(p.text, px(p.x), py(p.y), p.color, "center", 12);

  drawHUD();
  if (state === "ready") text("READY!", px(13.5), py(17), "#ffff00", "center", 16);
  if (state === "over") {
    text("GAME OVER", px(13.5), py(17), "#ff0000", "center", 16);
    if (Math.floor(anim * 2) % 2 === 0) text("PRESS ENTER", W / 2, py(14), "#fff", "center", 12);
  }
  if (paused) {
    ctx.fillStyle = "rgba(0,0,0,0.6)";
    ctx.fillRect(0, 0, W, H);
    text("PAUSED", W / 2, H / 2, "#ffff00", "center", 28);
    text("press P to resume", W / 2, H / 2 + 30, "#fff", "center", 14);
  }
}

// ---------- Input ----------
const KEYS = {
  ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
  w: "up", s: "down", a: "left", d: "right", W: "up", S: "down", A: "left", D: "right",
};
function startOrRestart() {
  if (state === "title" || state === "over") newGame();
}
addEventListener("keydown", (e) => {
  initAudio();
  const k = e.key;
  if (KEYS[k]) { pac.next = D[KEYS[k]]; e.preventDefault(); return; }
  if (k === "Enter" || k === " ") { startOrRestart(); e.preventDefault(); }
  else if (k === "p" || k === "P" || k === "Escape") {
    if (state !== "title" && state !== "over") paused = !paused;
  } else if (k === "m" || k === "M") muted = !muted;
  else if (k === "f" || k === "F") {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  }
});
addEventListener("blur", () => { if (state === "play" || state === "ready") paused = true; });

// Touch: swipe to steer, tap to start.
let touch = null;
cv.addEventListener("touchstart", (e) => {
  initAudio();
  const t = e.changedTouches[0];
  touch = { x: t.clientX, y: t.clientY };
  e.preventDefault();
}, { passive: false });
cv.addEventListener("touchend", (e) => {
  if (!touch) return;
  const t = e.changedTouches[0], dx = t.clientX - touch.x, dy = t.clientY - touch.y;
  touch = null;
  if (Math.hypot(dx, dy) < 20) { if (paused) paused = false; else startOrRestart(); return; }
  pac.next = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? D.right : D.left) : (dy > 0 ? D.down : D.up);
}, { passive: false });

// ---------- Main loop ----------
resetDots();
let last = performance.now();
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000);
  last = t;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
